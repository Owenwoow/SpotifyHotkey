name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /codepage:65001 /target:winexe /optimize+ /out:SpotifyHotkey.exe `
            /r:System.Windows.Forms.dll /r:System.Drawing.dll Program.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash SpotifyHotkey.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  SpotifyHotkey.exe" } | Set-Content SpotifyHotkey.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: SpotifyHotkey
          path: |
            SpotifyHotkey.exe
            SpotifyHotkey.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" SpotifyHotkey.exe SpotifyHotkey.exe.sha256 `
            --title "SpotifyHotkey ${{ github.ref_name }}" --generate-notes
